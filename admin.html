<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Panel Admin - Magang Berdampak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="hero slim">
    <div class="wrap row2">
      <div>
        <span class="pill"><i></i>Panel Admin</span>
        <h1>Kelola tautan magang</h1>
      </div>
      <div class="top-act" id="topact" hidden>
        <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">Lihat halaman mahasiswa</a>
        <button class="btn ghost sm" id="logout">Keluar</button>
      </div>
    </div>
  </header>

  <section class="login wrap" id="login">
    <h2>Masuk admin</h2>
    <p>Masukkan password untuk mengubah tautan.</p>
    <form id="lf">
      <input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <p class="err-t" id="lerr"></p>
      <button class="btn" type="submit">Masuk</button>
    </form>
  </section>

  <main class="wrap" id="panel" hidden>
    <p class="meta" id="sum" style="margin-top:22px"></p>
    <div class="progress"><i id="bar"></i></div>
    <p class="meta">Tempel link, lalu tunggu tanda “Aktif”. Mahasiswa langsung bisa membukanya, tanpa unggah file.</p>
    <div id="app"></div>
  </main>
  <div class="toast" id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
